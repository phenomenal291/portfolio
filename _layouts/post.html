<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="{{ '/assets/images/1311.png' | relative_url }}">
  <title>{{ page.title }} - Phuc Duong</title>
  <meta name="description" content="{{ page.description | default: page.title }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ '/css/typography.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/layout.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/utilities.css' | relative_url }}">
  <script defer src="{{ '/js/script.js' | relative_url }}"></script>
</head>
<body>

  <div id="main-content">
    <!-- NAV -->
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="site-nav-title">phuc duong</a>
      <ul class="site-nav-links">
        <li><a href="{{ '/#projects' | relative_url }}" class="nav-link">projects</a></li>
        <li><a href="{{ '/blog.html' | relative_url }}" class="nav-link active">blog</a></li>
        <li><a href="{{ '/books.html' | relative_url }}" class="nav-link">books</a></li>
        <li><a href="{{ '/#contact' | relative_url }}" class="nav-link">contact</a></li>
      </ul>
    </nav>

    <!-- ARTICLE HEADER -->
    <article>
      <header style="margin-bottom: 28px;">
        <div style="margin-bottom: 12px;">
          <a href="{{ '/blog.html' | relative_url }}" class="meta-text">← back to blog</a>
        </div>
        <h1 class="main-title" style="margin-bottom: 8px;">{{ page.title }}</h1>
        <div class="meta-text">
          <span>{{ page.date | date: "%B %d, %Y" }}</span>
          {% if page.tags %}
            <span> · </span>
            <span>tags: {{ page.tags | join: ", " }}</span>
          {% endif %}
        </div>
      </header>

      <!-- ARTICLE BODY -->
      <div id="post-content" class="post-body">
        {{ content }}
      </div>
    </article>

    <!-- FOOTER -->
    <footer class="site-footer">
      <a href="{{ '/blog.html' | relative_url }}">← back to blog</a>
      <span>Duong Tan Phuc</span>
    </footer>
  </div>

</body>
</html>
